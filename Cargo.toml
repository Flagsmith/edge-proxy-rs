[package]
name = "edge-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
parking_lot = "0.12"
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "trace", "normalize-path"] }
reqwest = { version = "0.13", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
http = "1"
validator = { version = "0.20", features = ["derive"] }
flagsmith-flag-engine = "0.6"

[dev-dependencies]
axum-test = "18"
mockall = "0.14"
tokio-test = "0.4"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
